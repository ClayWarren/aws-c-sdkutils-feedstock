schema_version: 1

context:
  name: aws-c-sdkutils
  version: "0.2.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/awslabs/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: 2af9e783869ae6ebf97e91043e9783a92778adcebebd45f9769519162113913c

build:
  number: 1

requirements:
  build:
    - cmake !=3.19.0,!=3.19.1
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ninja
  host:
    - aws-c-common
  run_exports:
    - ${{ pin_subpackage("aws-c-sdkutils", upper_bound="x.x.x") }}

tests:
  - script:
      - if: unix
        then:
          - test -f $PREFIX/lib/libaws-c-sdkutils${SHLIB_EXT}
          - test -f $PREFIX/include/aws/sdkutils/sdkutils.h
      - if: win
        then:
          - if not exist %LIBRARY_INC%\\aws\\sdkutils\\sdkutils.h exit 1
          - if not exist %PREFIX%\\Library\\bin\\aws-c-sdkutils.dll exit 1
  - if: win and arm64
    then:
      requirements:
        run:
          - ${{ compiler('c') }}
          - cmake
      files:
        recipe:
          - CMakeLists.txt
          - consumer.c
      script:
        - cmake -S . -B consumer-build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%"
        - cmake --build consumer-build
        - consumer-build\sdkutils_consumer.exe
        - dumpbin /headers "%LIBRARY_BIN%\aws-c-sdkutils.dll" | findstr /I /C:"AA64 machine (ARM64)"
        - dumpbin /headers consumer-build\sdkutils_consumer.exe | findstr /I /C:"AA64 machine (ARM64)"
about:
  license: Apache-2.0
  license_file: LICENSE
  summary: This is a module for the AWS SDK for C.
  homepage: https://github.com/awslabs/aws-c-sdkutils
  repository: https://github.com/awslabs/aws-c-sdkutils

extra:
  feedstock-name: aws-c-sdkutils
  recipe-maintainers:
    - xhochy
    - conda-forge/aws-sdk-cpp
